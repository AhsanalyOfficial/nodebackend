name: Deploy Node.js Backend with Docker

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DOCKER_SSH_KEY }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Navigate to project directory
            cd /home/ubuntu/nodebackend

            # Pull latest code
            git pull origin main

            # Copy docker-compose if needed (already in repo)

            # Stop and remove old containers
            docker-compose down

            # Remove old images
            docker system prune -f

            # Build and start new containers
            docker-compose up -d --build

            # Check status
            docker-compose ps

            # Show logs
            docker-compose logs --tail=50

            echo "✅ Docker deployment successful!"

            # Check if services are running
            if [ $(docker ps -q | wc -l) -eq 2 ]; then
              echo "🎉 Both containers are running!"
            else
              echo "⚠️ Warning: Not all containers are running"
              docker-compose ps
            fi

