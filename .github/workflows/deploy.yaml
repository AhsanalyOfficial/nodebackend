name: Deploy node backend to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

  steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-actions@v1.0.3
      with:
        host: ${{secrets.SSH_HOST}}
        user: ubuntu
        key: ${{secrets.SSH_KEY}}
        scripts: |
          cd /home/ubuntu/nodebackend
          git pull
          npm install
          node src/index.js
